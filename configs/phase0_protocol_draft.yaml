schema_version: 1
status: DRAFT_NOT_LOCKED
source: v2.6_full_report.md sections 12, 12b, 13
purpose: >-
  Phase 0 feasibility protocol for structured-state, action-conditioned
  MiniCraft world-model prediction across open-loop horizons. Not an
  adaptive-compute benchmark and not evidence for the core hypothesis.

data_splits:
  train: {range: [0, 999], allowed_for: [collection, fitting]}
  dev: {range: [1000, 1999], allowed_for: [exploratory_evaluation, iteration]}
  confirm: {range: null, status: NOT_DEFINED_OR_ACCESSED}

environment:
  class: minicraft.env.MiniCraftEnv
  observation_fields:
    - self.x
    - self.y
    - self.facing
    - self.health
    - self.food
    - inv.*
    - patch[7,7]
    - mobs[].{dx,dy,hp}
    - events.{last_result,damage,tick}
  actions: 9 discrete actions (0..8); action is the transition input.
  task: deterministic-mean open-loop prediction; compare against real observations.
  action_policy: >-
    seeded uniform-random candidates passed through the same MiniCraft hard
    safety filter for train collection and exploratory dev scoring; persist both
    candidate and applied actions and report controller interventions.
  snapshot_counterfactuals: required capability; not evaluated by this draft.

model:
  implementation: Soul RSSM with structured observation encoder/decoder
  schema_source: train split only; freeze encoder feature schema before dev scoring
  prediction: deterministic prior mean decoded to observation value slots
  uncertainty: NOT_IMPLEMENTED; zero placeholder must not be scored or cited

baselines:
  - id: persistence
    prediction: repeat the current encoded numeric observation values

diagnostics:
  - id: action_shuffle
    procedure: >-
      permute actions within each episode while holding observed contexts fixed
    purpose: action-conditioning diagnostic, not a performance baseline

metrics:
  primary: exploratory per-origin MSE over observed numeric feature slots, averaged within episode then equally across episodes
  weighting_status: IMPLEMENTATION_PROPOSAL_NOT_PROTOCOL_LOCKED
  horizons: [1, 5, 20, 100]
  prediction_modes: [reality_anchored, open_loop]
  feature_groups: [self, inventory, local_map, mobs, events, other]
  empty_target_origin: exclude_and_count
  report: [per_episode_scores, equal_episode_mean, per_feature_scores, per_feature_group_scores, observed_feature_counts]
  action_conditioning: paired change in model error after within-episode action permutation
  uncertainty_calibration: DEFERRED
  thresholds: TO_LOCK_AFTER_PROTOCOL_REVIEW; no threshold encoded here

provenance:
  record:
    - seed
    - split
    - episode
    - tick
    - action
    - action_counts
    - candidate_and_applied_action_counts
    - safety_filter_decisions
    - feature_schema_hash
    - model_revision
    - raw_predictions_targets_masks
    - protocol_config_sha256
  phase5_thresholds_or_test_seeds: NOT_DEFINED_OR_ACCESSED

cost:
  world_model_call: scripts/phase0_measure_cost.py
  horizons: [1, 5, 20, 100]
  report: [median_wall_seconds, p95_wall_seconds, runtime, source_hashes]
  skill_step_denominator: DEFERRED_UNTIL_SKILL_IMPLEMENTATION
  rho_h: NOT_COMPUTED_UNTIL_C_SKILL_STEP_EXISTS
