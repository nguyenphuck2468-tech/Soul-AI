name: Soul AI integrity and tests

on:
  push:
    branches: [main, "research/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soul-ai-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned research dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Validate research split and Confirm boundary
        run: python -m scripts.phase0_validate_protocol
      - name: Run complete regression suite
        run: python -m pytest -q
